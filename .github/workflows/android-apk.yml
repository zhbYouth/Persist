name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# 需要写权限来创建 Release（把 APK 发布成可直接点击下载的链接）
permissions:
  contents: write

jobs:
  build:
    # 固定系统版本：ubuntu-24.04 自带 Android SDK（platform 35 / build-tools / 已接受的许可）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # 构建失败时把关键错误行写成 GitHub 注解，在运行页面顶部直接可见
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            {
              grep -E '^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|AAPT|Could not' build.log | head -n 30
              echo '--- tail ---'
              tail -n 25 build.log
            } | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > errors.txt
            echo "::error title=Gradle build failed::$(cat errors.txt)"
          fi

      - name: Name the APK
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "Persist-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK=Persist-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: riheng-debug-apk
          path: Persist-*.apk
          if-no-files-found: error

      # 发布成 Release：手机浏览器里直接点 APK 就能下载，不用登录、不用解压
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-b${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "Persist ${VERSION}（构建 ${{ github.run_number }}）" \
            --notes "直接下载 \`${APK}\` 安装即可。签名固定，可覆盖安装旧版本，数据不会丢。提交：${{ github.sha }}"
